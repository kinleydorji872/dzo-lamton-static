      <use href="#win" x="22" y="42" transform="translate(0 0) scale(.8)"/><use href="#win" x="62" y="42" transform="translate(0 0) scale(.8)"/>
      <path d="M-14 4 L10 -18 H90 L114 4z" fill="url(#gold)" stroke="#7A4E0C" stroke-width="1.2"/>
      <path d="M16 -18 L35 -34 H65 L84 -18z" fill="url(#gold)" stroke="#7A4E0C" stroke-width="1.2"/>
    </g>
  </defs>

  <!-- far Himalayan ridge with snow -->
  <path d="M0 260 L120 190 L210 230 L360 120 L470 210 L560 170 L700 250 L820 150 L960 235 L1100 130 L1230 220 L1340 175 L1480 240 L1600 190 V420 H0z" fill="#8FA9C4" opacity=".8"/>
