  <use href="#tower" x="510" y="118"/><use href="#tower" x="990" y="118"/>

  <!-- central utse tower -->
  <rect x="690" y="84" width="220" height="102" fill="url(#wall)"/>
  <rect x="690" y="110" width="220" height="3" fill="#D4A02A"/><rect x="690" y="113" width="220" height="22" fill="#7A1D22"/><rect x="690" y="135" width="220" height="3" fill="#D4A02A"/>
  <use href="#win" x="728" y="146" transform="scale(1 1)"/><use href="#win" x="790" y="146"/><use href="#win" x="852" y="146"/>
