  <rect x="797" y="-14" width="6" height="22" fill="#D4A02A"/><circle cx="800" cy="-16" r="6" fill="#F6DA8A" stroke="#8F6410"/>

  <!-- darchor (tall white prayer flags) and cypress -->
  <g stroke="#6A4A2D" stroke-width="2"><line x1="226" y1="140" x2="226" y2="372"/><line x1="1374" y1="140" x2="1374" y2="372"/></g>
  <g fill="#FBFAF4" stroke="#B9B3A3" stroke-width=".8"><rect x="214" y="146" width="12" height="150"/><rect x="1374" y="146" width="12" height="150"/></g>
