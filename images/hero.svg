  <path d="M0 320 C150 270 260 300 400 280 C560 255 640 300 800 290 C980 280 1060 250 1220 275 C1380 298 1480 270 1600 300 V420 H0z" fill="#5F7C99"/>
  <path d="M0 362 C180 334 300 352 460 342 H1140 C1300 352 1420 328 1600 358 V420 H0z" fill="#2F5148"/>

