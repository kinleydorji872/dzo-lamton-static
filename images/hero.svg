  <rect x="430" y="206" width="740" height="90" fill="url(#wall)"/>
  <rect x="430" y="230" width="740" height="3" fill="#D4A02A"/><rect x="430" y="233" width="740" height="22" fill="#7A1D22"/><rect x="430" y="255" width="740" height="3" fill="#D4A02A"/>
