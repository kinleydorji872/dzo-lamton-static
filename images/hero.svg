<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 1600 444" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DA8A"/><stop offset=".55" stop-color="#D4A02A"/><stop offset="1" stop-color="#8F6410"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E7E1D2"/><stop offset=".5" stop-color="#FBFAF4"/><stop offset="1" stop-color="#E2DCCB"/></linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBFAF6" stop-opacity="0"/><stop offset="1" stop-color="#FBFAF6" stop-opacity=".95"/></linearGradient>
    <g id="win"><path d="M3 0h14l3 30H0z" fill="#3A2314"/><path d="M-2 -3h24l-1.5 4h-21z" fill="#6A4A2D"/><path d="M10 0v30M2 12h16" stroke="#8F6410" stroke-width="1" opacity=".7"/></g>
    <g id="cypress"><path d="M0 -70C14 -38 17 -14 9 0H-9C-17 -14 -14 -38 0 -70z" fill="#1F3B33"/></g>
