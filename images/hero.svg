  <polygon points="342,310 1258,310 1257,314 343,314" fill="#D4A02A"/>
  <polygon points="341,314 1259,314 1256,338 344,338" fill="#7A1D22"/>
  <polygon points="344,338 1256,338 1255,342 345,342" fill="#D4A02A"/>
